<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');

      .bg { animation: bgpulse 6s ease-in-out infinite alternate; }
      @keyframes bgpulse {
        0%   { opacity: 1; }
        100% { opacity: 0.85; }
      }

      .grid-line { stroke: #1e3a5f; stroke-width: 0.5; opacity: 0; animation: gridfade 1.2s ease forwards; }
      @keyframes gridfade { to { opacity: 1; } }

      .dot { fill: #58a6ff; animation: dotpulse 3s ease-in-out infinite alternate; }
      @keyframes dotpulse {
        0%   { opacity: 0.15; r: 1.5; }
        100% { opacity: 0.6;  r: 2.5; }
      }
      .dot:nth-child(odd)  { animation-delay: 0.5s; }
      .dot:nth-child(3n)   { animation-delay: 1.2s; }

      .scan { fill: none; stroke: #58a6ff; stroke-width: 1; opacity: 0;
              animation: scanline 4s ease-in-out infinite; }
      @keyframes scanline {
        0%   { transform: translateY(-200px); opacity: 0; }
        10%  { opacity: 0.18; }
        90%  { opacity: 0.18; }
        100% { transform: translateY(320px); opacity: 0; }
      }

      .name-text {
        font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
        font-size: 58px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: -1px;
        opacity: 0;
        animation: slidein 0.9s cubic-bezier(.22,1,.36,1) 0.3s forwards;
      }
      .accent { fill: #58a6ff; }

      .tag-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 400;
        fill: #7eadd4;
        letter-spacing: 1.5px;
        opacity: 0;
        animation: slidein 0.9s cubic-bezier(.22,1,.36,1) 0.7s forwards;
      }

      @keyframes slidein {
        from { opacity: 0; transform: translateX(-18px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      .bar { rx: 2; opacity: 0; animation: barin 0.6s ease forwards; }
      .bar1 { fill: #58a6ff; animation-delay: 0.9s; }
      .bar2 { fill: #1e3a5f; animation-delay: 1.1s; }
      .bar3 { fill: #58a6ff; animation-delay: 1.3s; }
      @keyframes barin { to { opacity: 1; } }

      .circle-ring {
        fill: none; stroke: #58a6ff; stroke-width: 1.2;
        opacity: 0;
        stroke-dasharray: 440;
        stroke-dashoffset: 440;
        animation: drawring 2s ease 0.5s forwards;
      }
      @keyframes drawring {
        to { stroke-dashoffset: 0; opacity: 0.25; }
      }
      .circle-ring-inner {
        fill: none; stroke: #58a6ff; stroke-width: 0.6;
        opacity: 0;
        stroke-dasharray: 280;
        stroke-dashoffset: 280;
        animation: drawring 1.8s ease 0.9s forwards;
      }

      .corner { stroke: #58a6ff; stroke-width: 1.5; fill: none; opacity: 0;
                animation: cornerin 0.5s ease forwards; }
      .c1 { animation-delay: 1.5s; }
      .c2 { animation-delay: 1.6s; }
      .c3 { animation-delay: 1.7s; }
      .c4 { animation-delay: 1.8s; }
      @keyframes cornerin { to { opacity: 0.7; } }

      .blink { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    </style>

    <linearGradient id="bg1" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#090d13"/>
      <stop offset="50%"  stop-color="#0b1929"/>
      <stop offset="100%" stop-color="#060c14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg1)" class="bg"/>

  <!-- Grid -->
  <g>
    <line class="grid-line" x1="0"   y1="40"  x2="900" y2="40"  style="animation-delay:0.05s"/>
    <line class="grid-line" x1="0"   y1="80"  x2="900" y2="80"  style="animation-delay:0.1s"/>
    <line class="grid-line" x1="0"   y1="120" x2="900" y2="120" style="animation-delay:0.15s"/>
    <line class="grid-line" x1="0"   y1="160" x2="900" y2="160" style="animation-delay:0.2s"/>
    <line class="grid-line" x1="0"   y1="200" x2="900" y2="200" style="animation-delay:0.25s"/>
    <line class="grid-line" x1="0"   y1="240" x2="900" y2="240" style="animation-delay:0.3s"/>
    <line class="grid-line" x1="100" y1="0"   x2="100" y2="280" style="animation-delay:0.05s"/>
    <line class="grid-line" x1="200" y1="0"   x2="200" y2="280" style="animation-delay:0.1s"/>
    <line class="grid-line" x1="300" y1="0"   x2="300" y2="280" style="animation-delay:0.15s"/>
    <line class="grid-line" x1="400" y1="0"   x2="400" y2="280" style="animation-delay:0.2s"/>
    <line class="grid-line" x1="500" y1="0"   x2="500" y2="280" style="animation-delay:0.25s"/>
    <line class="grid-line" x1="600" y1="0"   x2="600" y2="280" style="animation-delay:0.3s"/>
    <line class="grid-line" x1="700" y1="0"   x2="700" y2="280" style="animation-delay:0.35s"/>
    <line class="grid-line" x1="800" y1="0"   x2="800" y2="280" style="animation-delay:0.4s"/>
  </g>

  <!-- Grid dots at intersections -->
  <g>
    <circle class="dot" cx="100" cy="40"  r="1.5" style="animation-delay:0.3s"/>
    <circle class="dot" cx="200" cy="40"  r="1.5" style="animation-delay:0.6s"/>
    <circle class="dot" cx="300" cy="40"  r="1.5" style="animation-delay:0.2s"/>
    <circle class="dot" cx="400" cy="40"  r="1.5" style="animation-delay:0.9s"/>
    <circle class="dot" cx="500" cy="40"  r="1.5" style="animation-delay:0.4s"/>
    <circle class="dot" cx="600" cy="40"  r="1.5" style="animation-delay:0.7s"/>
    <circle class="dot" cx="700" cy="40"  r="1.5" style="animation-delay:1.1s"/>
    <circle class="dot" cx="800" cy="40"  r="1.5" style="animation-delay:0.1s"/>
    <circle class="dot" cx="100" cy="80"  r="1.5" style="animation-delay:0.8s"/>
    <circle class="dot" cx="200" cy="80"  r="1.5" style="animation-delay:0.3s"/>
    <circle class="dot" cx="300" cy="80"  r="1.5" style="animation-delay:1.0s"/>
    <circle class="dot" cx="400" cy="80"  r="1.5" style="animation-delay:0.5s"/>
    <circle class="dot" cx="500" cy="80"  r="1.5" style="animation-delay:0.2s"/>
    <circle class="dot" cx="600" cy="80"  r="1.5" style="animation-delay:0.7s"/>
    <circle class="dot" cx="700" cy="80"  r="1.5" style="animation-delay:1.3s"/>
    <circle class="dot" cx="800" cy="80"  r="1.5" style="animation-delay:0.4s"/>
    <circle class="dot" cx="100" cy="120" r="1.5" style="animation-delay:0.6s"/>
    <circle class="dot" cx="200" cy="120" r="1.5" style="animation-delay:1.1s"/>
    <circle class="dot" cx="300" cy="120" r="1.5" style="animation-delay:0.3s"/>
    <circle class="dot" cx="400" cy="120" r="1.5" style="animation-delay:0.8s"/>
    <circle class="dot" cx="500" cy="120" r="1.5" style="animation-delay:0.1s"/>
    <circle class="dot" cx="600" cy="120" r="1.5" style="animation-delay:0.9s"/>
    <circle class="dot" cx="700" cy="120" r="1.5" style="animation-delay:0.4s"/>
    <circle class="dot" cx="800" cy="120" r="1.5" style="animation-delay:1.2s"/>
    <circle class="dot" cx="100" cy="160" r="1.5" style="animation-delay:0.7s"/>
    <circle class="dot" cx="200" cy="160" r="1.5" style="animation-delay:0.2s"/>
    <circle class="dot" cx="300" cy="160" r="1.5" style="animation-delay:1.0s"/>
    <circle class="dot" cx="400" cy="160" r="1.5" style="animation-delay:0.5s"/>
    <circle class="dot" cx="500" cy="160" r="1.5" style="animation-delay:0.3s"/>
    <circle class="dot" cx="600" cy="160" r="1.5" style="animation-delay:0.8s"/>
    <circle class="dot" cx="700" cy="160" r="1.5" style="animation-delay:1.4s"/>
    <circle class="dot" cx="800" cy="160" r="1.5" style="animation-delay:0.6s"/>
    <circle class="dot" cx="100" cy="200" r="1.5" style="animation-delay:0.9s"/>
    <circle class="dot" cx="200" cy="200" r="1.5" style="animation-delay:0.4s"/>
    <circle class="dot" cx="300" cy="200" r="1.5" style="animation-delay:1.2s"/>
    <circle class="dot" cx="400" cy="200" r="1.5" style="animation-delay:0.1s"/>
    <circle class="dot" cx="500" cy="200" r="1.5" style="animation-delay:0.6s"/>
    <circle class="dot" cx="600" cy="200" r="1.5" style="animation-delay:1.1s"/>
    <circle class="dot" cx="700" cy="200" r="1.5" style="animation-delay:0.3s"/>
    <circle class="dot" cx="800" cy="200" r="1.5" style="animation-delay:0.7s"/>
    <circle class="dot" cx="100" cy="240" r="1.5" style="animation-delay:0.5s"/>
    <circle class="dot" cx="200" cy="240" r="1.5" style="animation-delay:1.0s"/>
    <circle class="dot" cx="300" cy="240" r="1.5" style="animation-delay:0.2s"/>
    <circle class="dot" cx="400" cy="240" r="1.5" style="animation-delay:0.8s"/>
    <circle class="dot" cx="500" cy="240" r="1.5" style="animation-delay:1.3s"/>
    <circle class="dot" cx="600" cy="240" r="1.5" style="animation-delay:0.4s"/>
    <circle class="dot" cx="700" cy="240" r="1.5" style="animation-delay:0.9s"/>
    <circle class="dot" cx="800" cy="240" r="1.5" style="animation-delay:0.1s"/>
  </g>

  <!-- Scan line sweep -->
  <rect class="scan" x="0" y="0" width="900" height="2"/>

  <!-- Right side decorative rings -->
  <circle class="circle-ring"       cx="770" cy="140" r="70"/>
  <circle class="circle-ring-inner" cx="770" cy="140" r="45"/>
  <circle fill="#58a6ff" cx="770" cy="140" r="3" opacity="0.4"
          style="animation: dotpulse 2s ease-in-out infinite alternate"/>

  <!-- Left accent glow strip -->
  <rect x="0" y="0" width="300" height="280" fill="url(#glow)"/>

  <!-- Accent bars -->
  <rect class="bar bar1" x="52" y="100" width="4"  height="80"/>
  <rect class="bar bar2" x="60" y="115" width="4"  height="50"/>
  <rect class="bar bar3" x="68" y="108" width="4"  height="64"/>

  <!-- Corner brackets top-left -->
  <polyline class="corner c1" points="52,60 52,52 60,52"/>
  <polyline class="corner c2" points="840,52 848,52 848,60"/>
  <polyline class="corner c3" points="52,220 52,228 60,228"/>
  <polyline class="corner c4" points="840,228 848,228 848,220"/>

  <!-- Name -->
  <text class="name-text" x="90" y="152">
    medha <tspan class="accent">sriram</tspan>
  </text>

  <!-- Tagline -->
  <text class="tag-text" x="92" y="182">
    AI / ML  ·  COMPUTER VISION  ·  AUTONOMOUS SYSTEMS
  </text>

  <!-- Cursor blink after name -->
  <rect class="blink" x="615" y="124" width="3" height="36" fill="#58a6ff"
        style="animation-delay:0.9s; opacity:0; animation: slidein 0.9s cubic-bezier(.22,1,.36,1) 0.3s forwards, blink 1.1s step-end 1.2s infinite;"/>
</svg>
